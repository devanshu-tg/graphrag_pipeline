<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GraphRAG · pipeline comparison</title>
<style>
/* ONE knob controls every text size on the page. Everything below is in rem, so changing
   --fs (or the A-/A+ control in the header) scales the whole interface coherently. The
   previous version used clamp(..,vw,..) per element, whose ceilings bound on wide displays
   and left the page reading tiny. */
:root{
  --fs:26px;
  --bg:#08090d;
  --surface:rgba(255,255,255,.034); --surface2:rgba(255,255,255,.058);
  --stroke:rgba(255,255,255,.12); --stroke2:rgba(255,255,255,.2);
  --ink:#f7f9fc; --dim:#c3ccd9; --faint:#94a0b0;
  --brand:#ff6b1a; --brand2:#ffb057;
  --p1:#64748b; --p2:#3b82f6; --p2p:#a855f7; --p3:#ff6b1a;
  --ok:#34d399;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
html{font-size:var(--fs);scroll-behavior:smooth}
*{box-sizing:border-box;-webkit-font-smoothing:antialiased}
body{margin:0;background:var(--bg);color:var(--ink);
  font:1rem/1.55 system-ui,-apple-system,"Segoe UI",Inter,Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(900px 520px at 10% -10%,rgba(255,107,26,.15),transparent 62%),
    radial-gradient(820px 480px at 94% 2%,rgba(59,130,246,.11),transparent 60%),
    radial-gradient(1100px 700px at 50% 110%,rgba(168,85,247,.08),transparent 65%)}
.wrap{position:relative;z-index:1;width:min(1680px,94vw);margin:0 auto;padding:1.5rem 0 4rem}

/* ── header ─────────────────────────────────────────── */
.top{display:flex;align-items:center;justify-content:space-between;gap:1.4rem;
  flex-wrap:wrap;margin-bottom:1.4rem}
.brand{display:flex;align-items:center;gap:.75rem}
.mark{width:2.3rem;aspect-ratio:1;border-radius:.62rem;flex:none;position:relative;
  background:linear-gradient(145deg,var(--brand),#ff9248);
  box-shadow:0 .4rem 1.3rem -.35rem rgba(255,107,26,.65)}
.mark:after{content:"";position:absolute;inset:26%;border-radius:.2rem;
  border:.12rem solid rgba(0,0,0,.45);border-right-color:transparent;
  border-bottom-color:transparent;transform:rotate(45deg)}
h1{font-size:1.28rem;margin:0;font-weight:650;letter-spacing:-.03em}
.tagline{color:var(--faint);font-size:.8rem;margin-top:.1rem}
.hdr-right{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--stroke);
  border-radius:.72rem;padding:.22rem;gap:.2rem;backdrop-filter:blur(14px)}
.seg button{background:none;border:0;color:var(--dim);padding:.6rem 1.1rem;border-radius:.55rem;
  font-weight:650;font-size:.9rem;line-height:1;font-family:inherit;cursor:pointer;transition:.18s cubic-bezier(.4,0,.2,1);
  display:flex;align-items:center;gap:.5rem;white-space:nowrap}
.seg button .sw{width:.42rem;height:.42rem;border-radius:50%;background:currentColor;opacity:.42}
.seg button.on{background:linear-gradient(145deg,var(--brand),#ff8a3d);color:#160c04;
  box-shadow:0 .35rem 1rem -.3rem rgba(255,107,26,.8)}
.seg button.on .sw{opacity:1}
.seg button:not(.on):hover{color:var(--ink);background:var(--surface2)}
.zoom{display:inline-flex;background:var(--surface);border:1px solid var(--stroke);
  border-radius:.72rem;overflow:hidden}
.zoom button{background:none;border:0;color:var(--dim);padding:.6rem .85rem;
  font-weight:750;font-size:.92rem;line-height:1;font-family:inherit;cursor:pointer;transition:.15s;min-width:2.2rem}
.zoom button:hover{background:var(--surface2);color:var(--ink)}
.zoom button+button{border-left:1px solid var(--stroke)}

/* ── hero + kpis ────────────────────────────────────── */
.hero h2{font-size:2.15rem;margin:0 0 .2rem;font-weight:670;letter-spacing:-.035em}
.hero p{color:var(--dim);margin:0;font-size:.98rem}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem;margin:1.15rem 0 1rem}
.kpi{background:var(--surface);border:1px solid var(--stroke);border-radius:.85rem;
  padding:1rem 1.25rem;backdrop-filter:blur(14px);position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:.15rem;background:var(--brand)}
.kpi.b2:before{background:var(--p2)} .kpi.b3:before{background:var(--ok)}
.kpi.b4:before{background:var(--p2p)}
.kpi .lbl{color:var(--faint);font-size:.78rem;text-transform:uppercase;letter-spacing:.09em;
  font-weight:750;margin-bottom:.45rem}
.kpi .big{font-size:2.6rem;font-weight:670;letter-spacing:-.045em;line-height:1;
  font-variant-numeric:tabular-nums}
.kpi .foot{color:var(--dim);font-size:.82rem;margin-top:.4rem}

/* ── layout ─────────────────────────────────────────── */
.cols{display:grid;grid-template-columns:1fr;gap:.8rem;align-items:start}
.cols>*,.cols3>*{min-width:0}
.cols3{display:grid;grid-template-columns:1fr;gap:.8rem;align-items:start}
@media(max-width:1180px){.cols,.cols3{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,1fr)}}

.panel{background:var(--surface);border:1px solid var(--stroke);border-radius:.9rem;
  padding:1.15rem 1.4rem;margin-bottom:.8rem;backdrop-filter:blur(14px)}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:.8rem;
  margin-bottom:.95rem;flex-wrap:wrap}
.ph h3{font-size:1.12rem;margin:0;font-weight:640;letter-spacing:-.015em}
.ph .hint{color:var(--faint);font-size:.8rem}

/* ── table ──────────────────────────────────────────── */
table{width:100%;border-collapse:separate;border-spacing:0}
th{text-align:right;color:var(--faint);font-size:.78rem;text-transform:uppercase;
  letter-spacing:.09em;font-weight:750;padding:0 .6rem .7rem}
th:first-child{text-align:left}
td{padding:.78rem .6rem;text-align:right;font-variant-numeric:tabular-nums;font-size:1.02rem;
  border-top:1px solid var(--stroke)}
td:first-child{text-align:left;font-weight:620}
tbody tr{transition:background .15s}
tbody tr:hover{background:rgba(255,255,255,.025)}
tbody tr.lead td{background:linear-gradient(90deg,rgba(255,107,26,.11),rgba(255,107,26,.02))}
.pill{display:inline-flex;align-items:center;gap:.55rem}
.pill i{width:.5rem;height:.5rem;border-radius:.15rem;flex:none;display:block}
.best{color:var(--brand2);font-weight:730}
.na{color:var(--faint)}

/* ── tier rows ──────────────────────────────────────── */
.tstack{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,20rem),1fr));gap:.72rem}
.tcard{background:var(--surface2);border:1px solid var(--stroke);border-radius:.72rem;
  padding:.85rem 1.05rem}
.tcard .th2{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.65rem}
.tcard h4{margin:0;font-size:1rem;font-weight:640}
.tcard .cnt{color:var(--faint);font-size:.78rem}
.row{margin:.6rem 0}
.row .lab{display:flex;justify-content:space-between;font-size:.92rem;margin-bottom:.3rem}
.row .lab span:first-child{color:var(--dim)}
.row .lab b{font-variant-numeric:tabular-nums;font-weight:650}
.track{height:.42rem;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden}
.fill{height:100%;border-radius:99px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.row .tok{color:var(--faint);font-size:.78rem;margin-top:.25rem;font-family:var(--mono)}

/* ── notes ──────────────────────────────────────────── */
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,26rem),1fr));gap:.55rem}
.note{display:flex;gap:.6rem;align-items:flex-start;color:var(--dim);font-size:.94rem;
  background:var(--surface2);border:1px solid var(--stroke);border-radius:.6rem;
  padding:.75rem .9rem;line-height:1.5}
.note i{color:var(--brand);flex:none;font-style:normal;font-weight:800}

/* ── console ────────────────────────────────────────── */
.ask{display:flex;gap:.6rem}
input[type=text]{flex:1;min-width:0;background:rgba(255,255,255,.075);
  border:1.5px solid var(--stroke2);border-radius:.8rem;padding:1.05rem 1.25rem;
  color:var(--ink);font-size:1.15rem;line-height:1.3;font-family:inherit;transition:.18s}
input[type=text]:focus{outline:none;border-color:var(--brand);
  box-shadow:0 0 0 .2rem rgba(255,107,26,.12)}
input::placeholder{color:var(--faint)}
.run{background:linear-gradient(145deg,var(--brand),#ff8a3d);color:#160c04;border:0;
  border-radius:.8rem;padding:0 2.4rem;font-weight:750;font-size:1.15rem;line-height:1;font-family:inherit;cursor:pointer;transition:.18s;
  box-shadow:0 .4rem 1.2rem -.4rem rgba(255,107,26,.75)}
.run:hover:not(:disabled){transform:translateY(-1px)}
.run:disabled{opacity:.42;cursor:not-allowed;box-shadow:none;transform:none}
.state{font-size:.86rem;color:var(--faint);margin:.7rem 0 0;min-height:1rem;
  display:flex;align-items:center;gap:.5rem}
.state b{color:var(--brand2);font-weight:640}

.gold{display:flex;align-items:baseline;gap:.7rem;flex-wrap:wrap;margin-top:.9rem;
  background:rgba(52,211,153,.09);border:1px solid rgba(52,211,153,.3);border-radius:.7rem;
  padding:.75rem 1rem}
.gold .lbl{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;font-weight:750;
  color:var(--ok)}
.gold .val{font-size:1rem;font-weight:640}
.verdict{margin-left:.5rem;font-size:.6rem;font-weight:800;letter-spacing:.06em;
  padding:.22rem .5rem;border-radius:.35rem;text-transform:uppercase}
.verdict.ok{background:rgba(52,211,153,.18);color:var(--ok)}
.verdict.part{background:rgba(255,176,87,.18);color:var(--brand2)}
.verdict.bad{background:rgba(248,113,113,.16);color:#ff9a9a}
.diff{margin-top:.7rem;font-size:.72rem;color:var(--faint);display:grid;gap:.2rem}
.diff b{color:var(--dim);font-weight:650}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem;margin-top:.95rem}
@media(max-width:1000px){.cards{grid-template-columns:1fr}}
.rc{background:var(--surface2);border:1px solid var(--stroke);border-radius:.78rem;
  overflow:hidden;animation:up .38s cubic-bezier(.2,.8,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(.5rem)}}
.rc .cap{padding:.72rem 1rem;display:flex;justify-content:space-between;align-items:center;
  border-bottom:1px solid var(--stroke);background:rgba(255,255,255,.025)}
.rc .cn{font-weight:650;font-size:1rem;display:flex;align-items:center;gap:.5rem}
.rc .cn i{width:.5rem;height:.5rem;border-radius:.15rem;display:block}
.rc .rt{font-size:.76rem;color:var(--faint);font-family:var(--mono);
  background:rgba(255,255,255,.055);padding:.2rem .45rem;border-radius:.35rem}
.rc .body{padding:.9rem 1rem}
.rc .ans{font-size:1.06rem;line-height:1.5;white-space:pre-wrap;word-break:break-word;
  min-height:2.6rem}
.rc .ans.empty{color:var(--faint);font-style:italic}
.rc .src{margin-top:.6rem;display:flex;flex-direction:column;gap:.2rem;font-size:.62rem;
  font-family:var(--mono);color:var(--faint);word-break:break-all}
.rc .src span:before{content:"source ";color:var(--brand);opacity:.7}
.rc .foot{display:flex;gap:.85rem;margin-top:.8rem;padding-top:.7rem;
  border-top:1px solid var(--stroke);font-size:.78rem;color:var(--faint);flex-wrap:wrap}
.rc .foot b{color:var(--dim);font-variant-numeric:tabular-nums;font-weight:650}
.rc.p1{border-top:.12rem solid var(--p1)} .rc.p2,.rc.p2rr{border-top:.12rem solid var(--p2)}
.rc.p2xl{border-top:.12rem solid var(--p2p)}
.rc.p3{border-top:.12rem solid var(--p3)}
.rc.cheap{border-color:rgba(255,107,26,.45)}

/* ── chips ──────────────────────────────────────────── */
.chipbar{display:flex;gap:.45rem;align-items:center;margin-bottom:.7rem;flex-wrap:wrap}
.filt{background:var(--surface2);border:1px solid var(--stroke);color:var(--dim);
  border-radius:.5rem;padding:.45rem .8rem;font-weight:650;font-size:.84rem;line-height:1;font-family:inherit;cursor:pointer;
  transition:.15s}
.filt.on{background:var(--brand);color:#160c04;border-color:transparent}
.filt:not(.on):hover{color:var(--ink)}
.chips{display:grid;grid-template-columns:1fr;gap:.5rem;
  max-height:46vh;overflow-y:auto;overflow-x:hidden;padding-right:.4rem}

.chips::-webkit-scrollbar{width:.42rem}
.chips::-webkit-scrollbar-thumb{background:var(--stroke2);border-radius:99px}
.chip{background:var(--surface2);border:1px solid var(--stroke);border-radius:.6rem;
  padding:.68rem .85rem;cursor:pointer;text-align:left;transition:.15s;
  display:flex;align-items:center;gap:.6rem;color:var(--dim);font:inherit;font-size:.94rem;
  min-width:0;width:100%}
.chip:hover{border-color:rgba(255,107,26,.5);color:var(--ink);transform:translateX(.15rem)}
.chip .qt{flex:1;min-width:0;line-height:1.42;overflow-wrap:anywhere}
.tag{font-weight:750;font-size:.7rem;line-height:1;font-family:inherit;text-transform:uppercase;letter-spacing:.07em;
  padding:.28rem .45rem;border-radius:.35rem;flex:none}
.tag.multi_hop,.tag.multi{background:rgba(255,107,26,.17);color:var(--brand2)}
.tag.single_dir{background:rgba(59,130,246,.17);color:#7fb2ff}
.tag.single_doc,.tag.single{background:rgba(148,163,184,.17);color:#b6c2d0}
.tag.aggregation{background:rgba(168,85,247,.17);color:#c9a0ff}
.tag.hard{background:rgba(248,113,113,.17);color:#ffa5a5}
.sp{width:.62rem;height:.62rem;border:.11rem solid var(--stroke2);border-top-color:var(--brand);
  border-radius:50%;animation:spin .7s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.skel{height:.72rem;border-radius:.3rem;background:linear-gradient(90deg,
  rgba(255,255,255,.05),rgba(255,255,255,.11),rgba(255,255,255,.05));
  background-size:200% 100%;animation:sh 1.3s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
@media(max-width:680px){
  .wrap{width:94vw} .ask{flex-direction:column} .run{padding:.85rem}
  .kpis{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="brand">
      <div class="mark"></div>
      <div>
        <h1>GraphRAG · pipeline comparison</h1>
        <div class="tagline">TigerGraph · four retrieval strategies · measured, not asserted</div>
      </div>
    </div>
    <div class="hdr-right">
      <div class="zoom" title="text size">
        <button id="zOut">A−</button><button id="zIn">A+</button>
      </div>
      <div class="seg">
        <button id="tFactual"><span class="sw"></span>Factual · SEC</button>
        <button id="tTextual" class="on"><span class="sw"></span>Textual · Enterprise</button>
      </div>
    </div>
  </div>

  <div class="hero">
    <h2 id="dsLabel">—</h2>
    <p id="dsSub">—</p>
  </div>
  <div class="kpis" id="kpis"></div>

  <div class="cols">
    <div class="panel" style="margin-bottom:0">
      <div class="ph"><h3>Benchmark</h3>
        <span class="hint">best per column highlighted</span></div>
      <table><thead id="thead"></thead><tbody id="tbody"></tbody></table>
    </div>
    <div class="panel" id="tierPanel" style="margin-bottom:0">
      <div class="ph"><h3>By question type</h3>
        <span class="hint">accuracy · tokens</span></div>
      <div class="tstack" id="tiers"></div>
    </div>
  </div>

  <div class="panel" style="margin-top:.8rem;border-color:rgba(255,107,26,.28);box-shadow:0 0 0 1px rgba(255,107,26,.06) inset">
    <div class="ph"><h3 id="askHead">Query console</h3>
      <span class="hint" id="askHint"></span></div>
    <div class="ask">
      <input type="text" id="q" autocomplete="off" placeholder="Ask something about the company…">
      <button class="run" id="go">Run</button>
    </div>
    <div class="state" id="state"></div>
    <div id="goldBox"></div>
    <div class="cards" id="cards"></div>
  </div>

  <div class="cols3">
    <div class="panel" style="margin-bottom:0">
      <div class="ph"><h3 id="chipHead">Tested queries</h3>
        <span class="hint" id="chipHint"></span></div>
      <div class="chipbar" id="chipbar"></div>
      <div class="chips" id="chips"></div>
    </div>
    <div class="panel" style="margin-bottom:0">
      <div class="ph"><h3>Reading the numbers</h3></div>
      <div class="notes" id="notes"></div>
    </div>
  </div>
</div>

<script>
const NAMES={p1:"LLM only",p2:"Basic RAG",p2rr:"Basic RAG",p2xl:"Basic RAG · 50",p3:"GraphRAG"};
const COL={p1:"var(--p1)",p2:"var(--p2)",p2rr:"var(--p2)",p2xl:"var(--p2p)",p3:"var(--p3)"};
let DATA=null, view="textual", CHIPS=[], onlyAnswered=true;

/* text size: persists, so the setting survives a refresh mid-demo */
let FS=parseFloat(localStorage.getItem("fs2")||"26");
function applyFS(){FS=Math.max(16,Math.min(40,FS));
  document.documentElement.style.setProperty("--fs",FS+"px");
  localStorage.setItem("fs2",FS)}
applyFS();
document.getElementById("zIn").onclick=()=>{FS+=2;applyFS()};
document.getElementById("zOut").onclick=()=>{FS-=2;applyFS()};

const f3=v=>v==null?'<span class="na">—</span>':(+v).toFixed(3);
const f2=v=>v==null?'—':(+v).toFixed(2);
const nu=v=>v==null?'<span class="na">—</span>':(+v).toLocaleString();
const esc=s=>(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function kpis(m){
  const g=m.overall.find(r=>r.name==="GraphRAG")||{};
  const b=m.overall.find(r=>r.name==="Basic RAG")||{};
  // strongest baseline of ALL non-graph arms, whichever it happens to be. Hardcoding
  // "iterative" understated it once the 50-chunk arm landed at 0.438.
  const bl=m.overall.filter(r=>r.arm!=="p3"&&r.arm!=="p1"&&r.f1!=null);
  const top=bl.reduce((a,r)=>(!a||r.f1>a.f1)?r:a,null);
  const save=(top&&top.tokens&&g.tokens)?Math.round(100*(g.tokens-top.tokens)/top.tokens):null;
  const cards=[
    {c:"", l:"GraphRAG accuracy", v:g.f1!=null?f2(g.f1):"—",
     f:g.n?`across ${g.n} questions`:"set F1, blended"},
    {c:"b2", l:"Best baseline", v:top?f2(top.f1):f2(b.f1),
     f:top?`${top.name} · ${nu(top.tokens)} tokens`:"—"},
    {c:"b3", l:"Tokens per query", v:nu(g.tokens),
     f:save!=null?`${save}% vs the best baseline`:"—"},
    {c:"b4", l:"Cost per 1k queries", v:g.cost!=null?"$"+g.cost.toFixed(2):"—",
     f:top&&top.cost!=null?`best baseline $${top.cost.toFixed(2)}`:"—"}];
  document.getElementById("kpis").innerHTML=cards.map(k=>
    `<div class="kpi ${k.c}"><div class="lbl">${k.l}</div>
     <div class="big">${k.v}</div><div class="foot">${k.f}</div></div>`).join("");
}

function table(m){
  const hj=m.overall.some(r=>r.judge!=null);
  const best=Math.max(...m.overall.map(r=>r.f1??0));
  const retr=m.overall.filter(r=>!/LLM only/.test(r.name));
  const cheap=Math.min(...retr.map(r=>r.tokens??1e9));
  document.getElementById("thead").innerHTML=
    `<tr><th>Pipeline</th><th>Set F1</th>`+
    `${hj?"<th>LLM judge</th>":""}<th>Tokens</th><th>Cost / 1k</th></tr>`;
  document.getElementById("tbody").innerHTML=m.overall.map(r=>{
    const lead=r.f1!=null&&r.f1===best&&best>0;
    return `<tr class="${lead?"lead":""}">
      <td><span class="pill"><i style="background:${COL[r.arm]||"var(--p3)"}"></i>${r.name}</span></td>
      <td class="${lead?"best":""}">${f3(r.f1)}</td>
      ${hj?`<td>${f3(r.judge)}</td>`:""}
      <td class="${r.tokens===cheap?"best":""}">${nu(r.tokens)}</td>
      <td>${r.cost==null?'<span class="na">—</span>':"$"+r.cost.toFixed(2)}</td></tr>`}).join("");
}

function tiers(m){
  const p=document.getElementById("tierPanel");
  if(!m.tiers||!m.tiers.length){p.style.display="none";return}
  p.style.display="";
  document.getElementById("tiers").innerHTML=m.tiers.map(t=>{
    const rs=t.rows.filter(r=>r.f1!=null);
    const best=Math.max(...rs.map(r=>r.f1));
    return `<div class="tcard"><div class="th2"><h4>${t.name}</h4>
      <span class="cnt">${t.rows[0]?.n||0} questions</span></div>
      ${rs.map(r=>`<div class="row">
        <div class="lab"><span>${r.name}</span>
          <b class="${r.f1===best?"best":""}">${f2(r.f1)}</b></div>
        <div class="track"><div class="fill" style="width:${Math.max(r.f1*100,1.2)}%;background:${COL[r.arm]||"var(--p1)"}"></div></div>
        <div class="tok">${nu(r.tokens)} tokens</div></div>`).join("")}
      </div>`}).join("");
}

function render(){
  const m=DATA[view];
  document.getElementById("dsLabel").textContent=m.label;
  document.getElementById("dsSub").textContent=m.subtitle;
  kpis(m); table(m); tiers(m);
  document.getElementById("notes").innerHTML=m.notes.map(n=>
    `<div class="note"><i>→</i><span>${n}</span></div>`).join("");
  document.getElementById("tFactual").className=view==="factual"?"on":"";
  document.getElementById("tTextual").className=view==="textual"?"on":"";
  const live=view==="textual";
  document.getElementById("askHead").textContent=live?"Query console · live":"Query console · replay";
  document.getElementById("askHint").textContent=live
    ? "runs all three pipelines against the real graph"
    : "replays the audited SEC run — not a live call";
  document.getElementById("q").placeholder=live
    ? "Ask something about the company…" : "Pick one of the SEC questions below…";
  document.getElementById("cards").innerHTML="";
  document.getElementById("state").innerHTML="";
}

function drawChips(){
  const list=onlyAnswered?CHIPS.filter(c=>c.answered!==false):CHIPS;
  const box=document.getElementById("chips");
  if(!list.length){
    box.innerHTML='<div class="note"><i>!</i><span>No questions match this filter.</span></div>';
  } else {
    box.innerHTML=list.map(e=>{
      const cls=(e.tier||"").replace(/\s+/g,"_");
      return `<button class="chip" data-q="${esc(e.q)}">
        <span class="tag ${cls}">${e.tier||"—"}</span>
        <span class="qt">${esc(e.q)}</span></button>`}).join("");
    box.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{
      document.getElementById("q").value=c.dataset.q;
      document.getElementById("q").focus();
      document.getElementById("q").scrollIntoView({behavior:"smooth",block:"center"});
    });
  }
  document.getElementById("chipHint").textContent="click to load";
}

async function loadChips(){
  CHIPS=await (await fetch("/api/examples?dataset="+view)).json();
  const any=CHIPS.some(c=>c.answered===false);
  const bar=document.getElementById("chipbar");
  bar.innerHTML = any
    ? `<button class="filt ${onlyAnswered?"on":""}" id="fA">Answered correctly</button>
       <button class="filt ${onlyAnswered?"":"on"}" id="fB">All questions</button>` : "";
  if(any){
    document.getElementById("fA").onclick=()=>{onlyAnswered=true;loadChips()};
    document.getElementById("fB").onclick=()=>{onlyAnswered=false;loadChips()};
  }
  drawChips();
}

async function ask(){
  const q=document.getElementById("q").value.trim(); if(!q)return;
  const btn=document.getElementById("go"), st=document.getElementById("state");
  const live=view==="textual";
  const ARMS=["p1","p2","p3"];
  btn.disabled=true;
  const t0=Date.now();

  // Each arm is its own request, fired together. Previously all three ran sequentially inside
  // ONE request, so the console waited for the SUM (~41s) even though the slowest arm is ~18s.
  // The bottleneck is the LLM call itself (17.2s of 18.2s measured; TigerGraph is 0.94s), so
  // there is nothing to optimise in our code — only the waiting can be overlapped.
  document.getElementById("cards").innerHTML=ARMS.map(a=>
    `<div class="rc ${a}" id="card-${a}">
       <div class="cap"><div class="cn"><i style="background:${COL[a]}"></i>${NAMES[a]}</div>
         <span class="rt"><span class="sp"></span></span></div>
       <div class="body"><div class="skel" style="width:84%"></div>
         <div class="skel" style="width:58%;margin-top:.5rem"></div></div></div>`).join("");
  document.getElementById("goldBox").innerHTML="";

  let done=0, gold=null, best=Infinity, results={};
  const paint=()=>{
    // cheapest RETRIEVAL arm — LLM-only always wins on tokens by retrieving nothing
    best=Math.min(...Object.values(results).filter(x=>x.arm!=="p1").map(x=>x.tokens), Infinity);
    for(const x of Object.values(results)) drawCard(x, best, gold);
  };
  st.innerHTML=`<span class="sp"></span> ${live?"running three pipelines in parallel":"replaying the frozen SEC run"} — 0/${ARMS.length} done`;

  await Promise.all(ARMS.map(async a=>{
    try{
      const r=await fetch("/api/query",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({question:q,arms:[a],dataset:view})});
      const d=await r.json();
      if(d.error){ results[a]={arm:a,answer:"could not run: "+d.error,tokens:0,route:"error"}; }
      else {
        if(d.gold&&!gold){ gold={answer:d.gold,qid:d.qid}; drawGold(gold); }
        const x=(d.results||[]).find(z=>z.arm===a)||(d.results||[])[0];
        if(x) results[a]=x;
      }
    }catch(e){ results[a]={arm:a,answer:"could not run: "+e,tokens:0,route:"error"}; }
    done++;
    paint();
    st.innerHTML = done<ARMS.length
      ? `<span class="sp"></span> running — ${done}/${ARMS.length} done`
      : `all ${ARMS.length} finished in <b>${((Date.now()-t0)/1000).toFixed(1)}s</b>`
        + (gold?" · verified against the answer key":" · no answer key for this question");
  }));
  btn.disabled=false;
}

function drawGold(g){
  document.getElementById("goldBox").innerHTML=
    `<div class="gold"><span class="lbl">Correct answer${g.qid?" · "+g.qid:""}</span>
      <span class="val">${esc(g.answer)}</span></div>`;
}

function drawCard(x,cheap,gold){
  const el=document.getElementById("card-"+x.arm); if(!el)return;
  const empty=!x.answer||x.answer==="(no answer)";
  const gr=x.grade;
  let badge="";
  if(gr){
    const pct=Math.round(gr.score*100);
    const cls = pct===100 ? "ok" : pct>0 ? "part" : "bad";
    badge=`<span class="verdict ${cls}">${pct===100?"CORRECT":pct>0?pct+"% correct":"WRONG"}</span>`;
  }
  el.className=`rc ${x.arm}${x.tokens===cheap?" cheap":""}`;
  el.innerHTML=
    `<div class="cap"><div class="cn"><i style="background:${COL[x.arm]}"></i>${NAMES[x.arm]}${badge}</div>
       <span class="rt">${esc(x.route||"—")}</span></div>
     <div class="body">
       <div class="ans ${empty?"empty":""}">${empty?"no answer returned":esc(x.answer)}</div>
       ${gr&&(gr.missed.length||gr.wrong.length)?`<div class="diff">
         ${gr.missed.length?`<div><b>missed</b> ${esc(gr.missed.join(", "))}</div>`:""}
         ${gr.wrong.length?`<div><b>not in the answer</b> ${esc(gr.wrong.join(", "))}</div>`:""}
       </div>`:""}
       ${(x.sources&&x.sources.length)?`<div class="src">${x.sources.map(v=>
          `<span>${esc(v.length>46?"…"+v.slice(-44):v)}</span>`).join("")}</div>`:""}
       <div class="foot">
         <span>tokens <b class="${x.tokens===cheap?"best":""}">${(x.tokens||0).toLocaleString()}</b></span>
         ${x.planner_tokens?`<span>planner <b>${x.planner_tokens.toLocaleString()}</b></span>`:""}
         ${x.chunks?`<span>chunks <b>${x.chunks}</b></span>`:""}
         ${x.latency?`<span><b>${x.latency}s</b></span>`:""}
       </div></div>`;
}

document.getElementById("tFactual").onclick=()=>{view="factual";render();loadChips()};
document.getElementById("tTextual").onclick=()=>{view="textual";render();loadChips()};
document.getElementById("go").onclick=ask;
document.getElementById("q").addEventListener("keydown",e=>{if(e.key==="Enter")ask()});

(async()=>{
  DATA=await (await fetch("/api/metrics")).json();
  render(); await loadChips();
  const s=await (await fetch("/api/status")).json();
  if(s.state!=="ready")
    document.getElementById("state").innerHTML=
      '<span class="sp"></span> warming the pipelines — the first live query will be slower';
})();
</script>
</body>
